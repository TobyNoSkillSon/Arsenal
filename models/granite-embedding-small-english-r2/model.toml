schema = 3
id = "granite-embedding-small-english-r2"
name = "Granite Embedding Small English R2"
kind = "embeddings"
summary = "Turns English text into 384-number vectors so you can search and compare passages by meaning."
description = "A 47M-parameter English text embedding model from IBM's Granite Embeddings family, with 384-dimension vectors and an 8192-token context. It was trained only on open-source relevance pairs under permissive licences plus IBM-collected data, for retrieval and semantic search. The card reports retrieval results on BEIR, MTEB-v2, CoIR and MLDR and an encoding speed on one H100; Arsenal has not measured these."
purpose = "Embed English text for search"
publisher = "ibm-granite"
released = 2025
params = "47.7M"
tasks = ["feature-extraction"]
languages = ["en"]
good_for = ["Semantic search and retrieval over English passages", "Comparing sentences, queries and documents by cosine similarity", "Documents up to 8192 tokens"]
limits = ["English only: the card says it was trained for English texts, so it does not handle Polish", "Vectors are unnormalized unless normalize is true; no query or document prefixes are used, as the card specifies", "Texts over 8192 tokens are cut when truncate is true (the default); otherwise the request is refused", "Text only: images, audio and mixed content are refused", "Parity with the maker code not run; benchmark quality not measured here"]
suggested = false

[links]
homepage = "https://huggingface.co/ibm-granite/granite-embedding-small-english-r2"

