# Settings panel reference for image models that take one size choice (docs/MODEL-FOLDER.md, "Settings panel"). The
# size choice is a setting row drawn as segments: name each size by its side. Copy it beside model.toml and tailor it.
schema = 1

[[section]]

[[section.row]]
setting = "resolution"
control = "segments"
labels = { "512x512" = "512²", "768x768" = "768²", "1024x1024" = "1024²" }

[[section.row]]
setting = "seed"
randomize = true

[[section]]
title = "More"
collapsed = true

[[section.row]]
setting = "steps"
