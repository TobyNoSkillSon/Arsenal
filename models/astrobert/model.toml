schema = 3
id = "astrobert"
name = "astroBERT"
kind = "embeddings"
summary = "Turns astronomy and astrophysics text into 768-number vectors, so similar passages land close together."
description = "astroBERT is a cased BERT-base language model (12 layers, 768 wide, 110M parameters) built by the NASA Astrophysics Data System team (Grezes et al., ADASS 2021) and pretrained with masked-language and next-sentence objectives on astrophysics papers from the ADS. This port serves the base model's embeddings as the maker's Tutorial 0 describes: the last hidden state, mean-pooled over the tokens. The card gives no benchmark score for the embeddings; the paper reports its gains on astronomy named-entity recognition over plain BERT."
purpose = "Embed astronomy text"
publisher = "adsabs"
released = 2022
params = "109.7M"
tasks = ["feature-extraction"]
languages = ["en"]
good_for = [
  "Grouping, clustering or classifying astronomy abstracts and paper passages by topic",
  "Features for a small downstream classifier on astrophysics text (the maker's own use)",
]
limits = [
  "Not trained for sentence similarity or search: its vectors cluster by topic and vocabulary, so unrelated texts still score around 0.5-0.7 cosine. For question-to-passage search a retrieval embedder does better.",
  "English astronomy text only; it does not handle Polish or other languages.",
  "512 tokens per text (about 350 words); longer texts are refused unless truncate is on.",
  "No instruction, no shorter dimensions; text input only. The masked-word, NER and SciX classifier heads on the card are not served.",
  "Parity: matches the maker's transformers code on MPS fp16 at cosine 0.99999 (log/003-parity.md).",
]
suggested = false

[links]
homepage = "https://huggingface.co/adsabs/astroBERT"

[licence]
spdx = "MIT"
name = "MIT"
commercial = true
url = "https://huggingface.co/adsabs/astroBERT/blob/6b9c25bb799152c5849a5b263ea71025fce548f0/README.md"

[facets]
modalities_in = ["text"]
modalities_out = ["text"]
# modalities: each of text, audio, image, video

