publisher = "BUT Speech@FIT"
released = 2025
suggested = false
summary = "Find who spoke when in meetings and far-field recordings, with up to four overlapping speakers, using a native Swift MLX worker."
description = "Brno University of Technology's DiariZen: a WavLM Large encoder structurally pruned to 63M parameters, four Conformer layers and a powerset head that marks up to four simultaneous speakers every 20 ms in 16-second windows, followed by pyannote-style WeSpeaker ResNet34 embeddings and VBx clustering across the recording. Trained on far-field single-channel meetings and conversations (AMI, AISHELL-4, AliMeeting, NOTSOFAR-1, MSDWild, DIHARD3, RAMC, VoxConverse); the card reports 13.9% DER on AMI, 10.1% on AISHELL-4, 14.5% on DIHARD3 and 9.1% on VoxConverse at collar 0, against 22.4%, 12.2%, 21.7% and 11.3% for pyannote 3.1."
purpose = "Who spoke when, meetings, overlaps"
good_for = ["Meetings and far-field room recordings", "Overlapping speech, up to four speakers at once", "Recordings with many speakers (the number is found automatically)", "Exclusive one-speaker-at-a-time turns for aligning transcripts", "RTTM export"]
limits = ["At most ten minutes per recording.", "At most four speakers active at the same moment within a 16-second window.", "The number of speakers is always found automatically; the maker's pipeline takes no speaker count.", "Reads the first channel of a multichannel file.", "Speakers are numbered, not identified; no speaker embeddings are returned.", "Not streaming: the whole recording is processed at once.", "Polish is untested here; training data is mostly English and Mandarin."]
