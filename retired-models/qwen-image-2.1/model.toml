limits = ["Qwen Research License: non-commercial use only; client and commercial work need a separate licence from Alibaba", "Tuned for 40 steps; Qwen-Image-2.1-Turbo makes the same images in 8", "Every reference image adds about 4,000 cached tokens and 2 GB of memory at 16-bit", "Prompts in languages other than English are untested in Arsenal"]
