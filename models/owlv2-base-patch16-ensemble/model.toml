schema = 3
id = "owlv2-base-patch16-ensemble"
name = "OWLv2 Base Patch16 Ensemble"
kind = "perception"
summary = "Finds and boxes whatever you name in a photo, from a list of short English phrases"
description = "OWLv2 is Google's open-vocabulary object detector (Minderer, Gritsenko and Houlsby, Scaling Open-Vocabulary Object Detection, 2023). A CLIP ViT-B/16 image encoder gives one candidate box per 16-pixel patch of a 960 by 960 view, and each box is scored against the text embedding of every query, so it finds objects it was never trained on by name. The CLIP backbone was trained on public image-caption data and fine-tuned with the detection heads on datasets such as COCO and OpenImages; OWLv2 adds self-training on web images, and this checkpoint is the ensemble variant. The card gives no benchmark figure."
purpose = "Find objects named in words"
publisher = "google"
released = 2023
params = "155.0M"
tasks = ["zero-shot-object-detection"]
languages = ["en"]
good_for = ["Finding everyday objects by name with no training (\"a cat\", \"a red car\", \"a coffee mug\")", "Several queries at once; each box gets the best-matching query"]
limits = ["English queries only; Polish words are not understood", "Each query is cut to 14 word pieces (the text encoder takes 16 tokens)", "No duplicate suppression, as in the maker's post-processing: one object can get two overlapping boxes", "Scores are calibrated low; good matches often score 0.2 to 0.7, so lower the threshold below the default 0.3 for hard queries", "Small objects in a large photo get few patches after the 960 by 960 resize"]
suggested = false

[links]
homepage = "https://huggingface.co/google/owlv2-base-patch16-ensemble"

[licence]
spdx = "Apache-2.0"
name = "Apache-2.0"
commercial = true
url = "https://huggingface.co/google/owlv2-base-patch16-ensemble/blob/cfd3195ba4ea9592eec887ded089f4c08eff231d/README.md"

[facets]
modalities_in = ["image", "text"]
modalities_out = ["text"]
