schema = 3
id = "glm-ocr"
name = "GLM-OCR"
kind = "local.document"
summary = "Reads the text in a document image or screenshot and returns it as plain text, keeping lines and paragraphs."
description = "GLM-OCR from Z.ai (zai-org): a CogViT vision encoder, a token-downsampling connector and a GLM-0.5B language decoder, built on the GLM-V encoder-decoder design and trained with multi-token prediction and reinforcement learning for document OCR. The card reports 94.62 on OmniDocBench V1.5, first overall. The checkpoint holds 1.3B parameters including an unused multi-token-prediction layer; the card counts 0.9B. Arsenal runs its Text Recognition task on the whole image."
purpose = "Read text from a document"
publisher = "zai-org"
released = 2026
params = "1.3B"
tasks = ["image-to-text"]
languages = ["zh", "en", "fr", "es", "ru", "de", "ja", "ko"]
good_for = [
  "Printed documents, receipts, forms and screenshots: text comes back line by line with blank lines between blocks",
  "Pages in Chinese, English, French, Spanish, Russian, German, Japanese or Korean",
]
limits = [
  "Runs only the card's Text Recognition prompt; the Formula Recognition, Table Recognition and JSON extraction prompts are not offered, and there is no layout analysis (the maker's SDK adds PP-DocLayoutV3 for that).",
  "Polish is not among the card's languages; plain Latin text reads fine, but Polish diacritics are untested.",
  "Column alignment is lost: a three-column table came back as single-spaced rows (Oak shelf 2 149.00).",
  "A tiny image still gets an answer: a 33x17 photo of a zebra was read as 'Zebra'.",
  "A large page becomes thousands of image tokens (up to about 4.8 million pixels after resizing), which needs several GB of memory.",
  "Parity with the maker code: output tokens identical on 3 of 3 fixed inputs (transformers 5.22 GlmOcrForConditionalGeneration, MPS fp16); see log/003-parity.md.",
]
suggested = false

[links]
homepage = "https://huggingface.co/zai-org/GLM-OCR"

[licence]
spdx = "MIT"
name = "MIT"
commercial = true
url = "https://huggingface.co/zai-org/GLM-OCR/blob/2e85a62840ccac27daa451df36c736c4636b8628/README.md"

[facets]
modalities_in = ["image"]
modalities_out = ["text"]
# modalities: each of text, audio, image, video

