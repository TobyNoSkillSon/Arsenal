summary = "Turns text into vectors for search by meaning, in over 100 languages."
description = "Qwen3 Embedding 0.6B is the smallest text embedding model in Alibaba Qwen's Qwen3 Embedding series, built on the Qwen3 0.6B language model. It reads up to 32K tokens and gives a 1024-number vector by taking the last token's hidden state. Its card reports a mean score of 64.33 on the MTEB multilingual benchmark, and it supports over 100 languages and code."
purpose = "Multilingual text embeddings"
good_for = ["Search by meaning across many languages, including Polish", "Similarity, clustering and classification of short and long texts", "Queries with a task instruction (task query) against plain documents"]
limits = ["Vectors match Qwen's own code (cosine 0.99999 on six texts); vectors from Arsenal builds before 1.0 left out the end token and are not interchangeable with these", "Vectors are not interchangeable with other embedding models", "Text only"]
