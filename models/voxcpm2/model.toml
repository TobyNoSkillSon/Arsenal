schema = 2
architecture = "voxcpm2"
id = "voxcpm2"
name = "VoxCPM2"
kind = "voices"
params = "2.4B"
publisher = "OpenBMB"
released = 2026
suggested = false
summary = "Speech in 30 languages, Polish included, at 48 kHz: a new voice, one described in words, or a clone of a short clip."
description = "OpenBMB's tokenizer-free text-to-speech model: a MiniCPM-4 language model reads the text and writes continuous audio latents patch by patch, a residual acoustic model and a small diffusion transformer shape each patch, and the AudioVAE V2 decodes them straight to 48 kHz. It needs no language tag for its 30 languages and nine Chinese dialects. It speaks without a reference, in a voice described in words in parentheses before the text, in the voice of a short clip, or as a continuation of a clip with its exact transcript, which the maker calls ultimate cloning. A description can also steer the style of a cloned voice. 2.38B parameters in all (the AudioVAE 94M)."
purpose = "Speech in 30 languages, voice cloning"
good_for = ["Polish and 29 more languages from one model, with no language setting", "Cloning a voice from a few seconds of audio, closest with the clip's exact transcript", "A new voice from a description such as (a calm older man, deep voice)", "Steering pace, tone or emotion of a cloned voice with a description"]
limits = ["No preset voices: a request speaks in a fresh voice, a described voice, a reference clip or a saved voice.", "The maker's reference denoiser (ZipEnhancer) and text normalizer (wetext) are not included; give clean clips and write numbers as words.", "No speed control; ask for a pace in the description instead.", "Audio arrives per chunk of text (about 400 characters), not per patch.", "Results vary between runs, as the maker says of voice design and style control; set seed to repeat one.", "Strictly forbidden by the maker for impersonation, fraud or disinformation; label AI-generated speech."]
languages = ["ar", "my", "zh", "da", "nl", "en", "fi", "fr", "de", "el", "he", "hi", "id", "it", "ja", "km", "ko", "lo", "ms", "no", "pl", "pt", "ru", "es", "sw", "sv", "tl", "th", "tr", "vi"]
tasks = ["text-to-speech"]
tools = ["voice", "sound"]

[facets]
modalities_in = ["text", "audio"]
modalities_out = ["audio"]

[licence]
spdx = "Apache-2.0"
name = "Apache License 2.0"
commercial = true
url = "https://huggingface.co/openbmb/VoxCPM2/blob/32279effe8c19989596f05d353d1447f51d9e915/README.md"

[weights]
