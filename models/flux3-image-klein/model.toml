[selection]
default = "native"

[[runner]]
name = "native"
language = "swift"
worker = "flux"
protocol = 1
chips = ["*"]
min_macos = "26.0"
fast_exact = false
features = ["sequentialOnly"]

[[op]]
name = "generate"
title = "Generate"
default = true
annotations = { primary = true }
input = "ops/generate.input.json"
output_schema = "ops/image.output.json"
output = "image"
stream = false
timeout_s = 3600
first_response_timeout_s = 900

[[op]]
name = "edit"
title = "Edit"
input = "ops/edit.input.json"
output_schema = "ops/image.output.json"
output = "image"
stream = false
timeout_s = 3600
first_response_timeout_s = 900

[[setting]]
id = "width"
title = "Width"
type = "number"
min = 64
max = 4096
step = 16
applies = "request"
maps_to = "request.width"
help = "Image width in pixels, a multiple of 16; width x height at most 4 megapixels. Empty: 1024 for a new image, the reference's size for an edit."

[[setting]]
id = "height"
title = "Height"
type = "number"
min = 64
max = 4096
step = 16
applies = "request"
maps_to = "request.height"
help = "Image height in pixels, a multiple of 16; width x height at most 4 megapixels. Empty: 1024 for a new image, the reference's size for an edit."

[[setting]]
id = "steps"
title = "Steps"
type = "number"
default = 16
min = 1
max = 100
step = 1
applies = "request"
maps_to = "request.steps"
help = "Denoising passes per image: the model is distilled for 16."

[[setting]]
id = "seed"
title = "Seed"
type = "number"
min = 0
max = 4294967295
step = 1
applies = "request"
maps_to = "request.seed"
help = "Starting noise: empty is a new random seed each request; the same seed and prompt give the same image."

[gate]
recipe = "gate/gate.toml"

[bench]
recipe = "bench/bench.toml"
