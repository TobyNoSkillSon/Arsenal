schema = 3
id = "clap-htsat-fused"
name = "CLAP HTSAT Fused"
kind = "local.audio-labels"
summary = "Labels a sound or music clip with whichever of your own text descriptions fits it best, with no training."
description = "CLAP HTSAT Fused is LAION's contrastive language-audio model (Wu et al., 2022): an HTSAT Swin audio encoder with feature fusion for clips of any length and a RoBERTa text encoder, mapped into one shared 512-number space (153.6M parameters). It was trained on LAION-Audio-630K, 633,526 audio-text pairs. Its paper reports state-of-the-art zero-shot audio classification and strong text-to-audio retrieval."
purpose = "Label sounds from your own words"
publisher = "laion"
released = 2023
params = "153.6M"
tasks = ["audio-classification"]
languages = ["en"]
good_for = [
  "Zero-shot labelling of sound effects, environmental sounds and music against any list of descriptions",
  "Sorting or searching a sample library by describing the sound (with return_embedding)",
  "Telling speech from music from noise before choosing a heavier model",
]
limits = [
  "Labels are scored against each other: the probabilities always sum to 1 over the labels you give, so add a catch-all label when none might fit.",
  "Very short clips are repeated to fill 10 seconds and get weaker, less certain labels (0.3 s of a chime came out as music, not a bell).",
  "Clips over 10 seconds are summarised from a shrunken whole plus three fixed 10-second crops (start, middle and end thirds); the maker picks those crops at random.",
  "English labels only: the text encoder is English RoBERTa, so Polish or other-language labels score poorly. It does not transcribe speech.",
  "Files not at 48 kHz are resampled with macOS's converter; the card leaves resampling to the user.",
]
suggested = false

[links]
homepage = "https://huggingface.co/laion/clap-htsat-fused"

[licence]
spdx = "Apache-2.0"
name = "Apache-2.0"
commercial = true
url = "https://huggingface.co/laion/clap-htsat-fused/blob/365dea6ef167def6676140ed93bbc43f84dabb28/README.md"

[facets]
modalities_in = ["audio"]
modalities_out = ["text"]
