# SPDX-License-Identifier: MIT
schema = 3
id = "gimm-vfi-r"
name = "GIMM-VFI-R"
kind = "restoration"
params = "19.8M"
publisher = "S-Lab, Nanyang Technological University"
released = 2024
suggested = false
architecture = "gimm_vfi_r"
purpose = "In-between frames at any moment"
summary = "Create in-between frames at any point between two images, or raise a video's frame rate, by modelling the motion between them."
description = "GIMM-VFI-R (NeurIPS 2024) interpolates a frame at any timestep between two frames. RAFT optical flow between the pair feeds a generalizable implicit motion model, a coordinate network that predicts the flow at any time t from forward-splatted motion latents, and AMT-style decoders refine that flow and blend three warped candidates into the frame. Flow and pair features are computed once per frame pair, so several timesteps of the same pair cost little extra. This is the RAFT variant trained on Vimeo-90K septuplets for arbitrary-timestep interpolation (gimmvfi_r_arb)."
good_for = ["Arbitrary in-between moments (any t from 0 to 1, up to sixteen per pair)", "Slow motion and frame-rate conversion of video", "Large and non-linear motion between frames"]
limits = ["Frames up to about a megapixel run at full flow resolution; larger frames estimate motion at half (1080p, 1440p) or a quarter (4K) of their size, as the makers run 2K footage", "Each frame pair runs RAFT for 20 iterations in both directions, so it is slower than RIFE", "Occlusions, motion blur and scene cuts between the frames produce ghosting", "Checked against the makers' code on one 281x240 pair; not benchmarked here"]
tasks = ["interpolate_video"]
languages = ["und"]
[facets]
modalities_in = ["image", "video"]
modalities_out = ["image", "video"]
