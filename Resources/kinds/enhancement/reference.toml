# Reference settings for an audio cleanup model. Copy the [[setting]] blocks its runner really accepts into
# model.toml, with that model's defaults, bounds and help; settings.toml beside this file arranges exactly these.

[[setting]]
id = "mode"
title = "Mode"
type = "choice"
default = "denoise"
choices = ["denoise", "restore", "upscale"]
applies = "request"
maps_to = "request.mode"
help = "Denoise removes noise; restore also repairs reverb, clipping and codec damage; upscale also raises the rate to 48 kHz."

[[setting]]
id = "chunk_seconds"
title = "Window"
type = "number"
default = 5
min = 1
max = 30
step = 1
applies = "load"
maps_to = "config.chunk_seconds"
help = "Audio cleaned in one pass; longer windows use more memory."
