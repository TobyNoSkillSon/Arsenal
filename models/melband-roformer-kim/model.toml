schema = 3
architecture = "mel_band_roformer"
id = "melband-roformer-kim"
name = "Mel-Band RoFormer Vocals (Kim)"
kind = "audio"
params = "228M"
publisher = "Kimberley Jensen"
released = 2024
suggested = false
summary = "Pull the vocals out of a song, or keep the instrumental, using a native Swift MLX worker."
description = "Kimberley Jensen's vocal model: a Mel-Band RoFormer (ByteDance's 2023 design, after lucidrains' implementation) that splits a 44.1 kHz stereo spectrum into 60 overlapping mel bands and runs six axial blocks of rotary-attention transformers over time and over bands (228M parameters). It predicts a complex mask for the vocals; the instrumental is the mix minus the vocals. Trained with ZFTurbo's training code on more data than the paper, which the maker says makes it slightly better than the paper's model."
purpose = "Pull voice out of music"
good_for = ["Vocals out of a full song, for karaoke, remixes, covers or transcription", "An instrumental bed without the voice", "Speech or narration out of music and sound effects", "Long tracks: it works through 8 s chunks, so memory stays flat"]
limits = ["Two stems only: vocals and everything else (instrumental).", "Stereo 44.1 kHz; mono is duplicated to both channels and other rates are resampled.", "Up to ten minutes per clip.", "Backing vocals and choirs count as vocals.", "A whole 8 s chunk runs even for a shorter clip."]
