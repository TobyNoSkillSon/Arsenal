# Get casts the BF16 language models and the FP32 AudioVAE to FP16 with a range check (Workers/Voices/Sources/VoxCPM2).
[derive]
fp16 = "cast:voxcpm2"

[selection]
default = "native"
chips = { m5 = "native" }

[[runner]]
name = "native"
language = "swift"
worker = "voices"
protocol = 1
chips = ["*"]
min_macos = "26.0"
fast_exact = false

[[setting]]
id = "voice"
title = "Voice"
type = "voice"
default = ""
applies = "request"
maps_to = "request.voice"
help = "Saved voice cloned for VoxCPM2; leave empty for a fresh, described or reference voice."

[[setting]]
id = "instructions"
title = "Voice description"
type = "text"
default = ""
applies = "request"
maps_to = "request.instructions"
help = "Describe a new voice, or the style of a cloned one: gender, age, tone, emotion, pace."

[[setting]]
id = "reference_path"
title = "Reference clip"
type = "text"
default = ""
applies = "request"
maps_to = "request.reference.path"
help = "Your own recording of the voice to clone, up to 30 seconds."

[[setting]]
id = "reference_text"
title = "Reference transcript"
type = "text"
default = ""
applies = "request"
maps_to = "request.reference.text"
help = "Exact words spoken in the reference clip; makes the clone closer."

[[op]]
name = "speak"
title = "Speak"
input = "ops/speak.input.json"
output = "audio"
stream = true
timeout_s = 590
first_response_timeout_s = 590

[[op]]
name = "voices"
title = "Voices"
input = "ops/voices.input.json"
output = "json"
stream = false

[[op]]
name = "clone_voice"
title = "Clone Voice"
input = "ops/clone_voice.input.json"
output = "json"
stream = false

[gate]
recipe = "gate/gate.toml"

[bench]
recipe = "bench/bench.toml"
