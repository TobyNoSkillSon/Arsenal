[derive]
fp16 = "cast:stable-audio-3-medium"
int8 = "intake-v1:stable-audio-3-medium"
int4 = "intake-v1:stable-audio-3-medium"
[selection]
default = "native"
chips = { m5 = "native" }
[[runner]]
name = "native"
language = "swift"
worker = "sound"
protocol = 1
chips = ["*"]
min_macos = "26.0"
fast_exact = true
[[op]]
name = "generate_sound"
title = "Generate Sound"
input = "ops/generate_sound.input.json"
output = "audio"
stream = true
[[op]]
name = "generate_music"
title = "Generate Music"
input = "ops/generate_music.input.json"
output = "audio"
stream = true
[[setting]]
id = "duration"
help = "Length of the generated audio, in seconds."
title = "Duration"
type = "number"
default = 5
min = 0.1
max = 380
applies = "request"
maps_to = "request.duration"
[[setting]]
id = "steps"
help = "Sampler passes per clip: more is slower; this model is tuned for 8."
title = "Steps"
type = "number"
default = 8
min = 1
max = 100
step = 1
applies = "request"
maps_to = "request.steps"
[[setting]]
id = "guidance"
help = "How strictly the audio follows the prompt; this model is tuned for 1."
title = "Guidance"
type = "number"
default = 1
min = 0
max = 20
applies = "request"
maps_to = "request.guidance"
[gate]
recipe = "gate/gate.toml"
[bench]
recipe = "bench/bench.toml"
