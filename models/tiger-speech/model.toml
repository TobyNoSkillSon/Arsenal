schema = 3
id = "tiger-speech"
name = "TIGER Speech"
kind = "audio"
summary = "Splits a recording of two people talking over each other into one clean track per speaker."
description = "TIGER (Time-frequency Interleaved Gain Extraction and Reconstruction) is a 0.8M-parameter speech separation network from Mohan Xu, Kai Li, Guo Chen and Xiaolin Hu at Tsinghua University (ICLR 2025). It splits the spectrum into 67 frequency bands and alternates band-wise and frame-wise modelling with multi-scale selective attention. The makers' training recipe for this size uses their EchoSet dataset (two overlapping speakers with noise and realistic reverberation, 16 kHz), and the paper reports that TIGER beats TF-GridNet on EchoSet with 94.3% fewer parameters and 95.3% fewer MACs."
purpose = "Separate two overlapping speakers"
publisher = "JusperLee"
released = 2025
params = "0.8M"
tasks = ["audio-to-audio"]
languages = ["mul"]
good_for = [
  "Two people talking at the same time in a meeting, interview or call recording",
  "Speech with background noise and room echo (it was trained on noisy, reverberant mixtures)",
  "Preparing overlapped speech for transcription, one speaker per track",
]
limits = [
  "Always returns exactly two tracks; with one speaker the second track is mostly residue, and three or more speakers are not separated.",
  "Which speaker lands in speaker1 or speaker2 is arbitrary and can differ between files.",
  "Works at 16 kHz: higher-rate input is resampled and the tracks come back as 16 kHz mono; stereo input is mixed to mono.",
  "One pass over the whole file, so input is limited to 60 seconds; peak GPU memory was about 2.5 GB for a 60-second file.",
  "Trained on speech only: music or sound effects are not separated into their own stem.",
  "It does not read or write language; it was trained on English speech and other languages, Polish included, were not tested.",
]
suggested = false

[links]
homepage = "https://huggingface.co/JusperLee/TIGER-speech"

[licence]
spdx = "Apache-2.0"
name = "Apache-2.0"
commercial = true
url = "https://huggingface.co/JusperLee/TIGER-speech/blob/f0340340b2d9bbf72074edf8c076dcab59a10ba2/README.md"

[facets]
modalities_in = ["audio"]
modalities_out = ["audio"]
# modalities: each of text, audio, image, video

[weights]
repo = "JusperLee/TIGER-speech"
revision = "f0340340b2d9bbf72074edf8c076dcab59a10ba2"
dtype = "fp32"
files = ["model.safetensors", "config.json"]

[weights.sha256]
"model.safetensors" = "7e5fac7a9083c94b3a00c524f323188d4dd19ef09a54c29d1fec12ac114922db"
"config.json" = "1643c4e30cb97bc67024965aae13d631d44efdd304d8379cfd92143791017946"

[weights.bytes]
"model.safetensors" = 3367352
"config.json" = 249

[derive]
fp16 = "cast:arsenal-kit-half-v1"

[selection]
default = "kit"

[[runner]]
name = "kit"
language = "swift"
worker = "kit-tiger-speech"
protocol = 1
chips = ["*"]
min_macos = "26.0"
fast_exact = false
features = ["sequentialOnly"]

[[op]]
name = "separate_audio"
title = "Separate audio"
input = "ops/separate_audio.input.json"
output = "file"
output_schema = "ops/separate_audio.output.json"
stream = false
timeout_s = 300
first_response_timeout_s = 300

[gate]
recipe = "gate/gate.toml"

[bench]
recipe = "bench/bench.toml"
