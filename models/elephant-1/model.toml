# SPDX-License-Identifier: MIT
schema = 3
id = "elephant-1"
name = "elephant-1"
kind = "decisions"
params = "9.41B"
publisher = "Baseten"
released = 2026
suggested = false
summary = "Calibrated yes/no, choice and score decisions on text, JSON, pictures and short videos, every question from one shared prefill."
description = "elephant-1, Base Labs at Baseten's 9B decision model: a full fine-tune of Qwen3.5-9B (an 8.95B text decoder and a 0.46B vision encoder, frozen during the fine-tune) on 6.21M decision examples with a Brier calibration term, served with a block-bidirectional mask on its full-attention layers and a softmax over the answer-slot letters. The makers report 62.65 on the Jev Decision Index 0.4, the best model under 15B, and 65.2 on their replica of the Artificial Analysis Decision Index."
purpose = "Text, image and video decisions"
good_for = ["routing and triage with calibrated probabilities", "questions about screenshots, photos and scans next to their text", "what happens across a short clip given as frames", "yes/no checks, one-of-many choices and graded scores on the same state", "many questions about one document from a single prefill", "guardrail and policy decisions on structured JSON"]
limits = ["Pictures (PNG or JPEG, up to 64 megapixels) and videos as frame lists (2 to 768 stills of one size, with an fps) go in media and are placed by <image:N> / <video:N> in the state; video files themselves are not decoded, send their frames. A picture costs 64 to 16,384 tokens, a video up to 768 per pair of frames (960 for a 5-frame list). JPEGs are decoded by macOS, not PIL, and can differ slightly.", "Trained and evaluated in English; one Polish request answered correctly in a quick check, not measured.", "Trained on sequences up to 16,384 tokens; up to 32,768 for the state plus one question (65,536 per request, the makers' serving limits) is accepted but unverified beyond one long-input check. Longer requests are refused, not truncated.", "No calibration file ships with the checkpoint, so probabilities are its raw softmax."]
tasks = ["yes-no", "choice", "score", "visual-inspection"]
languages = ["en"]
tools = []
context = 32768
