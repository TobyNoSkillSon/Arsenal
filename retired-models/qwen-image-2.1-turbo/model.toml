[selection]
default = "native"
[[runner]]
name = "native"
language = "swift"
worker = "qwenimage"
protocol = 1
chips = ["*"]
min_macos = "26.0"
fast_exact = false
features = ["sequentialOnly"]
[[op]]
name = "generate"
title = "Generate"
input = "ops/generate.input.json"
output_schema = "ops/image.output.json"
output = "image"
stream = false
timeout_s = 3600
first_response_timeout_s = 900
[[op]]
name = "edit"
title = "Edit"
input = "ops/edit.input.json"
output_schema = "ops/image.output.json"
output = "image"
stream = false
timeout_s = 3600
first_response_timeout_s = 900
[[setting]]
id = "width"
title = "Width"
type = "number"
default = 1024
min = 256
max = 2752
step = 32
applies = "request"
maps_to = "request.width"
help = "Image width in pixels, a multiple of 32; native up to 2K."
[[setting]]
id = "height"
title = "Height"
type = "number"
default = 1024
min = 256
max = 2752
step = 32
applies = "request"
maps_to = "request.height"
help = "Image height in pixels, a multiple of 32; native up to 2K."
[[setting]]
id = "seed"
title = "Seed"
type = "number"
min = 0
max = 4294967295
step = 1
applies = "request"
maps_to = "request.seed"
help = "Starting noise: empty is a new random seed each request; the same seed and prompt give the same image."
[gate]
recipe = "gate/gate.toml"
[bench]
recipe = "bench/bench.toml"
