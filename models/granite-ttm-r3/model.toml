files = ["model.safetensors", "config.json"]

[weights.sha256]
"model.safetensors" = "8ec0509a18a38f65b02f046fc28298ab3acf5d54eecb0a0df959b9fa001bc9fb"
"config.json" = "8e62cd4f1e4b1655ecc8c6ef9a9cf802d2ec64846a064a5072a59fd23688f062"

[weights.bytes]
