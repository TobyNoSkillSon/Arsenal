schema = 3
id = "manga-ocr-base"
name = "Manga OCR Base"
kind = "local.document"
summary = "Reads the Japanese text in a manga speech bubble or text crop, vertical or horizontal."
description = "Manga OCR is a vision encoder-decoder for Japanese text: a ViT (DeiT-base) image encoder and a 2-layer character-level BERT-Japanese decoder, 111M parameters, by Maciej Budyś (kha-white). It was trained on Manga109-s and synthetic manga-style text, and aims to stay robust to vertical and horizontal text, furigana, text over pictures, many fonts and low-quality scans. It reads one text block per image and also works as a general printed-Japanese OCR. The card gives no benchmark score."
purpose = "Read Japanese manga text"
publisher = "kha-white"
released = 2022
params = "111.0M"
tasks = ["image-to-text"]
languages = ["ja"]
good_for = [
  "One speech bubble or caption cropped from a manga page, vertical or horizontal",
  "Short printed Japanese text crops: signs, screenshots, titles, furigana-heavy text",
]
limits = [
  "Reads one text block per image and has no text detector: crop each bubble first, a whole page is not split into bubbles.",
  "Trained for Japanese only; it is not meant for Polish. Latin letters and digits inside Japanese text come out full-width (ＬＩＮＫ, ７).",
  "On a tiny or blurred crop it invents plausible Japanese instead of refusing (a 33x17 crop gave a made-up sentence).",
  "Up to 299 characters per image.",
  "Parity with the maker code: 4-beam output tokens identical on 6 of 6 fixed inputs (transformers 5.22, MPS fp16); see log/003-parity.md.",
]
suggested = false

[links]
homepage = "https://huggingface.co/kha-white/manga-ocr-base"

[licence]
spdx = "Apache-2.0"
name = "Apache-2.0"
commercial = true
url = "https://huggingface.co/kha-white/manga-ocr-base/blob/82c77fb84369e0fce0d6e8f0ad96fa82646d0346/README.md"

