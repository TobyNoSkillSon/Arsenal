# SPDX-License-Identifier: MIT
# FLUX 3 Image Klein in the signed catalog: a gated download under the FLUX Kommunity License (non-commercial, with
# commercial outputs only for qualifying users under a revenue cap), shown before Get. The user accepts the licence on
# Hugging Face and adds a read token; the bundled flux worker serves it (architecture flux3-image-klein).
schema = 3
id = "flux3-image-klein"
name = "FLUX 3 Image Klein"
kind = "images"
tools = ["image"]
architecture = "flux3-image-klein"
params = "5.6B"
publisher = "Black Forest Labs"
released = 2026
suggested = false
purpose = "Image generation and editing"
summary = "Black Forest Labs' 16-step image model: text to image, edits and compositions from 1 to 10 reference images, legible text."
tasks = ["text-to-image", "image-to-image"]
languages = ["en"]
good_for = ["Photographs, illustrations and product shots from full scene captions, up to 4 megapixels", "Text rendered inside the image: signs, labels, posters", "Editing a photo from a caption of the result, and composing up to 10 reference images", "Layout with bounding boxes written into the prompt (a JSON list of elements on a 0 to 1000 grid)"]
limits = ["FLUX Kommunity License: non-commercial use; commercial output only for Qualifying Users under US$5M annual revenue; FLUX trademarks need permission", "Takes full scene captions: the maker says not to use it without a prompt upsampler (its 9B Pup model, not included); a short prompt gives generic images", "No negative prompt or guidance (distilled, 16 steps)", "About 31 GB of memory at 1024 x 1024 in BF16 (the maker's figure); a 20 GB download from a gated repository"]

[facets]
modalities_in = ["text", "image"]
modalities_out = ["image"]

[licence]
spdx = "LicenseRef-FLUX-Kommunity-License-1.0"
name = "FLUX Kommunity License v1.0"
commercial = false
url = "https://huggingface.co/black-forest-labs/flux-3-image-klein/blob/337337621b8526e120f2275d250242f4a6bedd75/LICENSE.md"
conditions = "FLUX Kommunity License: you accept it on Hugging Face and Arsenal downloads from black-forest-labs/flux-3-image-klein with your token. Non-commercial use; generating outputs for commercial use is allowed only for Qualifying Users under US$5M gross annualized revenue (including affiliates). Black Forest Labs and FLUX trademarks need prior written permission. The Qwen3-VL-4B-Instruct text encoder is Apache-2.0."

# The BF16 release in the diffusers layout. Only these files: no FP8/NVFP4 variants, no BFL-format duplicates
# (model.safetensors, ae.safetensors). The text_encoder files are byte-identical to Qwen/Qwen3-VL-4B-Instruct at
# ebb281ec70b05090aa6165b016eac8ec08e71b17 (same git blob ids), which pins the small files' SHA-256 without access to
# the gated copies. The VAE file is float32; the runner casts it to BF16 at load.
[weights]
repo = "black-forest-labs/flux-3-image-klein"
revision = "337337621b8526e120f2275d250242f4a6bedd75"
dtype = "bf16"
