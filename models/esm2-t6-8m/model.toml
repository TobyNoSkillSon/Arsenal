schema = 3
id = "esm2-t6-8m"
name = "ESM-2 8M"
kind = "local.science"
summary = "Turns a protein sequence (one-letter amino-acid codes) into a vector of numbers for similarity search, clustering or downstream prediction."
description = "ESM-2 is Meta AI's protein language model, trained by masked language modelling on protein sequences from UniRef50 (Lin et al., 2022, Evolutionary-scale prediction of atomic-level protein structure with a language model). This is the 8M size: 6 transformer layers, 320 wide, 7.8M parameters, the smallest ESM-2: fast and light, for quick similarity searches, clustering or as features for a small classifier. Arsenal returns the final-layer embedding averaged over residues, and per-residue embeddings on request. The model card gives no benchmark score; it says larger sizes are generally more accurate."
purpose = "Embed protein sequences"
publisher = "facebook"
released = 2022
params = "7.8M"
tasks = ["feature-extraction"]
languages = ["mul"]
good_for = ["Comparing proteins: similar sequences, homologues and point mutants get high cosine similarity", "Features for a small classifier or regressor (function, localisation, stability) trained on top", "Per-residue features for residue-level tasks such as binding-site or secondary-structure prediction"]
limits = ["At most 1,022 residues per request (ESM-2's training crop); longer proteins are refused, so embed them in windows yourself", "Uppercase one-letter amino-acid codes only (the 20 standard plus X, B, U, Z, O); other characters are refused. Not for DNA or RNA", "Embeddings alone predict nothing: a property needs a model trained on top of them. Structure prediction (ESMFold) and the masked-residue head are not served", "It is the weakest ESM-2 size: the card says larger checkpoints are more accurate. Use ESM-2 650M when quality matters more than speed.", "Reads and writes no human language, so the Polish question does not apply", "Parity with transformers EsmModel (MPS, float16) checked: see log/003-parity.md"]
suggested = false

