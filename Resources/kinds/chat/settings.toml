# Settings panel reference for chat models (docs/MODEL-FOLDER.md, "Settings panel"). Copy it beside model.toml and
# tailor it to the settings that model declares: its context choices, whether it thinks, its sampling defaults.
schema = 1

[[section]]

[[section.row]]
setting = "context_limit"

[[section.row]]
setting = "thinking"

[[section.row]]
label = "Style"
presets = [
  { title = "Precise", values = { temperature = 0.2, top_p = 0.9 } },
  { title = "Balanced", values = { temperature = 0.7, top_p = 0.95 } },
  { title = "Creative", values = { temperature = 1.0, top_p = 1.0 } },
]

[[section.row]]
setting = "system_prompt"
control = "editor"

[[section]]
title = "More"
collapsed = true

[[section.row]]
setting = "temperature"

[[section.row]]
setting = "top_p"

[[section.row]]
setting = "max_tokens"
unit = "tokens"
