# Folder kernels for Laya Multilingual (docs/KERNELS.md); sources identical to laya-english/kernels.
#   linear.down  - the K > N Linears (mlp.Wo 1152->768 + residual, head linear2 + bias + residual). MLX splits K only for some of them; the Exact gate refuses a kernel it never reached.

[[kernel]]
id = "smallm-tile"
chip = "m5"
mode = "fast"
replaces = "linear.down"
entry = "smallm_tile"
api = "mlx"
files = ["m5/smallm_tile.h.metal", "m5/smallm_tile.metal"]
header = "m5/smallm_tile.h.metal"
inputs = ["x", "w", "bias", "res"]
outputs = ["out"]

# Exact on every NAX chip: MLX's own split-K GEMM in one dispatch (+ bias/residual epilogue), bit-identical to the
# stock path. Declines every call MLX would not route to split-K.
[[kernel]]
id = "splitk-exact"
chip = "*"
mode = "exact"
replaces = "linear.down"
entry = "splitk_exact"
api = "mlx"
files = ["any/splitk_exact.h.metal", "any/splitk_exact.metal"]
header = "any/splitk_exact.h.metal"
inputs = ["x", "w", "bias", "res"]
outputs = ["out"]
