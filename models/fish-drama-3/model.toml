# The 16-bit release is listed so the vendor tier has its source, but no runner here serves it (72 GB).
[[format]]
id = "bf16"
storage = "bf16"
source = "vendor"
bits_per_weight = 16
runners = []

# Routed experts 4-bit, every other projection and the audio tower 8-bit (group 64); embeddings bf16; norms and codec float32 on disk.
[[format]]
id = "int4"
storage = "affine"
source = "vendor"
bits_per_weight = 5
profile = { group_size = 64, default_bits = 8, module_bits = { "mlp.switch_mlp" = 4 } }
ram_mb = 27000
runners = ["native"]

[[runner]]
name = "native"
language = "swift"
worker = "voices"
protocol = 1
chips = ["*"]
min_macos = "26.0"
fast_exact = false

[selection]
default = "native"
chips = { m5 = "native" }

[facets]
modalities_in = ["text", "audio"]
modalities_out = ["audio"]

[[setting]]
id = "voice"
title = "Voice"
type = "voice"
default = ""
applies = "request"
maps_to = "request.voice"
help = "Saved voice cloned for Drama 3; leave empty to use the reference clip."

[[setting]]
id = "reference_path"
title = "Reference clip"
type = "text"
default = ""
applies = "request"
maps_to = "request.reference.path"
help = "Your own recording of the voice to clone, up to 30 seconds."

[[setting]]
id = "reference_text"
title = "Reference transcript"
type = "text"
default = ""
applies = "request"
maps_to = "request.reference.text"
help = "Exact words spoken in the reference clip."

[[op]]
name = "speak"
title = "Speak"
input = "ops/speak.input.json"
output = "audio"
stream = true

[[op]]
name = "voices"
title = "Voices"
input = "ops/voices.input.json"
output = "json"
stream = false

[[op]]
name = "clone_voice"
title = "Clone Voice"
input = "ops/clone_voice.input.json"
output = "json"
stream = false

[gate]
recipe = "gate/gate.toml"

[bench]
recipe = "bench/bench.toml"

