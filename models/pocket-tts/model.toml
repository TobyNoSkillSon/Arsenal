maps_to = "request.voice"
help = "Default preset voice for speech requests."

[[setting]]
id = "reference_path"
title = "Reference clip"
type = "text"
default = ""
applies = "request"
maps_to = "request.reference.path"
help = "Local reference WAV used for voice cloning."

[[op]]
name = "speak"
title = "Speak"
input = "ops/speak.input.json"
output = "audio"
stream = true

[[op]]
name = "voices"
title = "Voices"
input = "ops/voices.input.json"
output = "json"
stream = false

[[op]]
name = "clone_voice"
title = "Clone Voice"
