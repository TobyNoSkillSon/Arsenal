schema = 3
id = "vitpose-base-simple"
name = "ViTPose Base Simple"
kind = "local.pose"
summary = "Finds 17 body keypoints, from nose to ankles, for the person in a photo."
description = "ViTPose Base Simple is a plain Vision Transformer (12 layers, 768 wide, 85.9M parameters) with a light decoder that turns its features into one heatmap per keypoint. Yufei Xu, Jing Zhang, Qiming Zhang and Dacheng Tao published it in the ViTPose paper (2022); usyd-community ported it to transformers. It was trained on MS COCO, AI Challenger, MPII and CrowdPose. The card's headline score, 81.1 AP on the COCO keypoint test-dev set, belongs to the larger ViTPose+ family; this base checkpoint's own score appears only as a chart on the card."
purpose = "Find body keypoints"
publisher = "usyd-community"
released = 2025
params = "85.9M"
tasks = ["keypoint-detection"]
languages = ["en"]
good_for = [
  "One person filling most of a photo: nose, eyes, ears, shoulders, elbows, wrists, hips, knees and ankles",
  "Posture or exercise-form checks on a cropped person",
]
limits = [
  "No person detector in this port: the whole photo is treated as one person. In a wide room shot with a small person, the legs land on the furniture; cropped to the person, the skeleton fit and the scores went from 0.16-0.61 to 0.63-0.94.",
  "Several people in one photo are not separated. The card's own example runs a separate detector first.",
  "Weak joints score below about 0.4. Occluded people are the card's hardest case (OCHuman).",
  "It has no language input or output, so Polish does not apply.",
  "Parity with the maker's transformers code on MPS FP16: joints within 2.2 pixels on a 640x425 photo",
]
suggested = false

[links]
homepage = "https://huggingface.co/usyd-community/vitpose-base-simple"

[licence]
spdx = "Apache-2.0"
name = "Apache-2.0"
commercial = true
url = "https://huggingface.co/usyd-community/vitpose-base-simple/blob/a93ac0c67e0b7e2c55287d21d4c460c8f3c54d45/README.md"

[facets]
