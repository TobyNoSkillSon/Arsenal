schema = 3
id = "esm3-sm-open-v1"
name = "ESM3 Open Small (esm3-sm-open-v1)"
kind = "local.protein"
summary = "Reads and writes proteins across sequence, structure and function: fills in masked residues, scores mutations, folds a sequence into a backbone, designs a sequence for a structure, and predicts what a protein does."
description = "ESM3 is a generative masked language model over three tracks of a protein at once: amino-acid sequence, 3D structure (as 4,096 learned structure tokens) and function (InterPro entries and keywords), plus secondary structure and solvent accessibility. This is esm3-sm-open-v1, the open 1.4B transformer, released by EvolutionaryScale, now Chan Zuckerberg Biohub, with the paper 'Simulating 500 million years of evolution with a language model' (Hayes et al., Science 2025); it was trained on 2.78 billion natural proteins. Arsenal ships the transformer with the structure-token encoder and decoder and the function-token decoder, so a prompt can mix tracks and the answer comes back as residues, a PDB backbone with pLDDT and pTM, or function annotations. On ProteinGym's zero-shot substitution benchmark the model's average Spearman is 0.466 (rank 14 of the summary table), against 0.414 for ESM-2 650M."
purpose = "Protein design and prediction"
publisher = "biohub"
released = 2024
params = "2.70B"
tasks = ["fill-mask", "feature-extraction", "text-generation"]
languages = ["mul"]
good_for = [
  "Filling in masked residues of a sequence (_ marks a mask), with the alternatives and their probabilities, plus the predicted secondary structure and solvent accessibility of every residue",
  "Scoring mutations without any training data: masked or wild-type marginals over single and multiple substitutions (ProteinGym zero-shot average Spearman 0.466, the maker's benchmark table, not reproduced here)",
  "Folding a sequence into a backbone: structure tokens by iterative unmasking, then the structure decoder's N, CA, C coordinates with per-residue pLDDT, pTM and the predicted aligned error, written as a PDB file",
  "Inverse folding: a PDB backbone in, a designed sequence out, with the recovery against the file's own sequence",
  "Predicting what a protein does: InterPro entries and function keywords over residue ranges, from sequence, structure or both",
  "Prompting across tracks at once (a motif's coordinates inside a longer protein, a secondary-structure string, SASA values, function keywords) and generating one track at a time, including the maker's chain of thought (function, secondary structure, structure, then sequence)",
  "Per-residue and pooled embeddings of the final layer for search, clustering and features",
]
limits = [
  "At most 1,024 residues per request, one chain: multi-chain complexes (the maker's | chain break and its chain_id track) are not ported, so a complex must be sent one chain at a time",
  "Structure prompts read N, CA and C of the first model of a PDB file, amino acids only; mmCIF, gzip files, and residue-level insertion handling beyond the first alternate location are not covered; a PDB with no residue holding N, CA and C is refused",
  "A reply carries at most 640,000 numbers (16 MiB as JSON): per-residue embeddings up to 415 residues, the predicted aligned error up to 800 residues, returned logits up to 640,000 numbers in all; larger asks are refused before the model runs",
  "Residue annotations can be read back from the model's own head but cannot be prompted: the maker's residue-annotation tokenizer needs its per-residue reference letters, so such labels are accepted and leave that track empty",
  "No batching: one protein per request. Generation runs one forward pass per step, at most 1,024 passes per generate request summed over its tracks, so it ends inside the 15-minute limit",
  "Not ported from the maker's code: the Forge/Biohub service API, batch generation, chain-of-thought as one call (send the tracks in order yourself), guided and constrained generation, cRMSD against a reference, SASA from a structure (the maker computes it with biotite, not the model), and the ESMFold2, ESMC and SAE models in the same repository",
  "The model generates plausible proteins, not verified ones: a design needs wet-lab or at least independent structure prediction. The maker filtered viruses and select agents from its training data and its keyword vocabulary, and asks users to follow its acceptable-use policy",
  "Reads and writes no human language, so the Polish question does not apply",
  "Matches the maker's own esm code on Apple GPU (bf16 reference, FP16 port) on fixed inputs per component; see log/002-parity.md and gate/golden/golden.json. The maker's benchmark figures are not reproduced here",
]
suggested = false

