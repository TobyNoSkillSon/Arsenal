schema = 3
architecture = "sortformer_streaming"
id = "sortformer-4spk-v2"
name = "Streaming Sortformer Diarizer 4spk v2"
kind = "audio"
params = "117M"
publisher = "NVIDIA"
released = 2025
suggested = false
summary = "Find who spoke when, live or on a recording, for up to four speakers, using a native Swift MLX worker."
description = "NVIDIA's streaming Sortformer: a 17-layer Fast-Conformer (NEST) encoder and an 18-layer Transformer that output each of four speakers' activity every 80 ms, numbering speakers in the order they first speak. An arrival-order speaker cache keeps identities stable across chunks, so it can diarize a live stream or hours of audio. Trained on about 2,450 hours of real conversations and 5,150 hours of simulated mixtures; the card reports 13.24% DER on DIHARD III (up to four speakers) and 6.57% on two-speaker CALLHOME at 1.04 s latency."
purpose = "Who spoke when, live, up to 4"
good_for = ["Meetings, calls and interviews with up to four speakers", "Live diarization sessions with latency from 0.32 s to 30 s", "Long recordings without clustering", "Overlapping speech (each speaker has its own activity track)", "Per-speaker activity probabilities every 80 ms"]
limits = ["At most four speakers; accuracy drops with five or more.", "Trained mostly on English; other languages, including Polish, are untested here.", "Speakers are numbered by arrival, not identified; no speaker embeddings.", "Up to one hour per recording, ten minutes per live session.", "Noisy or out-of-domain audio degrades accuracy."]
languages = ["en"]
tasks = ["diarize"]
tools = ["operation"]
