[facets]
modalities_in = ["text", "audio"]
modalities_out = ["audio"]

[selection]
default = "native"
chips = { m5 = "native" }

[[setting]]
id = "voice"
title = "Voice"
type = "voice"
default = ""
applies = "request"
maps_to = "request.voice"
help = "Choose a saved voice; leave empty to use the description or reference inputs."


[[setting]]
id = "instructions"
excludes = ["description", "reference", "voice"]
title = "Voice description"
type = "text"
default = "A warm adult narrator with a clear, relaxed conversational voice."
applies = "request"
maps_to = "request.instructions"
help = "Describe the voice and delivery for the next request."

[[setting]]
id = "reference_path"
title = "Reference clip"
type = "text"
default = ""
applies = "request"
maps_to = "request.reference.path"
help = "Local reference WAV used for voice cloning."

[[setting]]
id = "reference_text"
title = "Reference transcript"
type = "text"
default = ""
applies = "request"
maps_to = "request.reference.text"
help = "Exact words spoken in the reference clip."

[[op]]
name = "speak"
title = "Speak"
input = "ops/speak.input.json"
output = "audio"
stream = true

[[op]]
name = "voices"
title = "Voices"
input = "ops/voices.input.json"
output = "json"
stream = false

[[op]]
name = "design_voice"
title = "Design Voice"
input = "ops/design_voice.input.json"
output = "json"
stream = false

[[op]]
name = "clone_voice"
title = "Clone Voice"
input = "ops/clone_voice.input.json"
output = "json"
stream = false

