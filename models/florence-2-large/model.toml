schema = 3
id = "florence-2-large"
name = "Florence-2 Large"
kind = "local.vision"
summary = "Writes an English caption for a photo, short or detailed, or reads the text in it line by line."
description = "Florence-2 Large from Microsoft: a DaViT image encoder feeding a 12-layer BART-style encoder-decoder, 777M parameters, trained on FLD-5B (5.4 billion annotations over 126 million images) to handle many vision tasks from a text prompt. This release is continued pretraining with a 4k context, and its OCR writes line breaks. Arsenal runs its pure-text tasks: caption, detailed caption, more detailed caption and OCR. The card reports zero-shot COCO caption CIDEr 135.6 and NoCaps 120.8."
purpose = "Caption a photo or read its text"
publisher = "microsoft"
released = 2024
params = "776.7M"
tasks = ["image-text-to-text"]
languages = ["en"]
good_for = [
  "One-sentence captions of everyday photos",
  "Paragraph descriptions with the prompt <DETAILED_CAPTION> or <MORE_DETAILED_CAPTION>",
  "Reading printed English text such as signs and labels with the prompt <OCR>, one line per line",
]
limits = [
  "English only; it does not write Polish, and OCR of Polish diacritics is untested.",
  "The prompt is either a task token (<CAPTION>, <DETAILED_CAPTION>, <MORE_DETAILED_CAPTION>, <OCR>) or the start of a caption to continue; detection, grounding and segmentation tasks are not offered because their boxes do not fit the caption output.",
  "The card warns this continued-pretraining release used only 0.1B samples and might not be trained well.",
  "Every image is squashed to 768x768, so very wide or tall images lose detail; a tiny image still gets a confident caption (a 33x17 zebra came back as a cheetah).",
  "The detailed captions can invent details (a green car was also called bright turquoise).",
  "Parity with the maker code: output tokens identical on 9 of 9 fixed requests across all four tasks and a caption prefix (maker's repo code under transformers 5.22, MPS fp16); see log/003-parity.md.",
]
suggested = false

[links]
homepage = "https://huggingface.co/microsoft/Florence-2-large"

