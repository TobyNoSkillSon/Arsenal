summary = "Find text, images, PDF pages, audio and video by meaning, all in one vector space."
description = "LCO-Embedding-Omni-7B, the language-centric omnimodal embedding model of 'Scaling Language-Centric Omnimodal Representation Learning' (NeurIPS 2025): the thinker of Qwen2.5-Omni 7B (a Qwen2.5 7B language model with a window-attention vision encoder and a Whisper-style audio encoder, 8.93B parameters) contrastively trained on text, so text, images, audio and video land in one 3,584-dimension space. The makers report state of the art on MIEB-Lite (51 image-embedding tasks) and on the MAEB audio benchmark without audio training."
purpose = "Search text, images, audio and video"
good_for = ["semantic search across text, photos, PDF pages, sound and video in one index", "text-to-image, text-to-audio and text-to-video retrieval", "visual document retrieval", "similarity, clustering and classification"]
limits = ["The soundtrack of a video is not used; embed it separately as audio.", "32,768 tokens per input: about 13 letter-size PDF pages or 40 seconds of full-size video; at most 5 minutes of audio per part.", "One prompt for queries and documents; no instructions or shorter dimensions."]
