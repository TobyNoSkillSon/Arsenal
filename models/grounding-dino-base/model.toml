schema = 3
id = "grounding-dino-base"
name = "Grounding DINO Base"
kind = "perception"
summary = "Finds and boxes the things you describe in a short English phrase"
description = "Grounding DINO (Liu et al., IDEA Research, 2023) extends the DINO detector with a BERT text encoder and fuses image and text features throughout, so it detects any object you name rather than a fixed list. This base variant uses a Swin-B image backbone, picks 900 candidate boxes from the image-text features and refines them in six decoder layers. The card reports 52.5 AP on COCO zero-shot."
purpose = "Find objects described in words"
publisher = "IDEA-Research"
released = 2023
params = "232.8M"
tasks = ["zero-shot-object-detection"]
languages = ["en"]
good_for = ["Finding objects named in plain words, including descriptive phrases (\"black cable\", \"a remote control\")", "Several things at once; each box is labelled with the phrase it matched"]
limits = ["English only; Polish words are not understood", "Labels and phrases are lowercased and joined as \"a. b.\" for the model; full stops, commas and semicolons split a phrase into separate things to find, at most 256 tokens in all", "No duplicate suppression, as in the maker's post-processing: one object can get two overlapping boxes, and a box around a whole group can appear beside the single objects", "Each box gets the one phrase whose words score highest; the maker's own post-processing can return a partial phrase instead", "Needs more memory than OWLv2: a Swin-B backbone on an 800-pixel view plus six encoder and six decoder layers", "At most 128 things per request"]
suggested = false

[links]
homepage = "https://huggingface.co/IDEA-Research/grounding-dino-base"

[licence]
spdx = "Apache-2.0"
name = "Apache-2.0"
commercial = true
url = "https://huggingface.co/IDEA-Research/grounding-dino-base/blob/12bdfa3120f3e7ec7b434d90674b3396eccf88eb/README.md"

[facets]
modalities_in = ["image", "text"]
modalities_out = ["text"]
# modalities: each of text, audio, image, video

