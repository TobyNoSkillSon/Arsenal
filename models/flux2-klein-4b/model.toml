tools = ["image"]
id = "flux2-klein-4b"
kind = "images"
languages = ["en"]
name = "FLUX.2 Klein 4B"
params = "4B"
publisher = "Black Forest Labs"
released = 2026
schema = 2
suggested = true
summary = "Four-step image generation with a local Qwen3 text encoder."
purpose = "Image generation"
tasks = ["text-to-image"]

[bench]
recipe = "bench/bench.toml"

[facets]
modalities_in = ["text"]
modalities_out = ["image"]

[gate]
recipe = "gate/gate.toml"

[licence]
commercial = true
spdx = "Apache-2.0"
url = "https://huggingface.co/black-forest-labs/FLUX.2-klein-4B/blob/e7b7dc27f91deacad38e78976d1f2b499d76a294/LICENSE.md"

[[op]]
input = "ops/generate.input.json"
name = "generate"
output = "image"
output_schema = "ops/generate.output.json"
stream = false
title = "Generate"

[popularity]
as_of = "2026-10-03"
hf_downloads = 400725
hf_likes = 998

[[runner]]
chips = ["*"]
fast_exact = false
language = "swift"
min_macos = "26.0"
name = "native"
protocol = 1
worker = "flux"

[derive]
int8 = "mlx-affine-g64:flux2-klein-4b"
int4 = "mlx-affine-g64:flux2-klein-4b"

[selection]
default = "native"

[[setting]]
applies = "request"
default = 1024
excludes = ["resolution"]
id = "width"
help = "Image width in pixels, a multiple of 16."
maps_to = "request.width"
max = 2048
min = 64
step = 16
title = "Width"
type = "number"

[[setting]]
applies = "request"
default = 1024
excludes = ["resolution"]
id = "height"
help = "Image height in pixels, a multiple of 16."
maps_to = "request.height"
max = 2048
min = 64
step = 16
title = "Height"
type = "number"

[[setting]]
applies = "request"
default = 4
id = "steps"
help = "Denoising passes per image: more is slower and can add detail; this model is tuned for 4."
maps_to = "request.steps"
max = 100
min = 1
step = 1
title = "Steps"
type = "number"

[[setting]]
applies = "request"
id = "seed"
help = "Starting noise: empty is a new random seed each request; the same seed and prompt give the same image."
maps_to = "request.seed"
max = 4294967295
min = 0
step = 1
title = "Seed"
type = "number"

