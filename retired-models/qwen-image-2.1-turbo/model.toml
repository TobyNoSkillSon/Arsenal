# SPDX-License-Identifier: MIT
schema = 3
id = "qwen-image-2.1-turbo"
name = "Qwen-Image-2.1-Turbo"
kind = "images"
tools = ["image"]
architecture = "qwen-image-2.1"
params = "7B"
publisher = "Qwen"
released = 2026
suggested = true
purpose = "Fast image generation and editing"
summary = "Qwen-Image-2.1 distilled to 8 steps: the same text, transparency and multi-reference editing in about a quarter of the time."
tasks = ["text-to-image", "image-to-image"]
languages = ["en"]
good_for = ["Website hero art, backgrounds, banners and illustrations up to 2K (2048 × 2048, 2752 × 1536)", "Legible text and typography: posters, signs, UI and infographics", "Transparent RGBA images such as stickers, icons and cut-out objects", "Editing a photo or design, and composing up to 10 reference images: people, products, masks, circled or painted notes"]
limits = ["Qwen Research License: non-commercial use only; client and commercial work need a separate licence from Alibaba", "Always runs its saved 8-step schedule without guidance; Qwen publishes no quality comparison with the 40-step base", "Every reference image adds about 4,000 cached tokens and 2 GB of memory at 16-bit", "Prompts in languages other than English are untested in Arsenal"]
[facets]
modalities_in = ["text", "image"]
modalities_out = ["image"]
[licence]
spdx = "LicenseRef-Qwen-Research"
name = "Qwen Research License Agreement"
commercial = false
url = "https://huggingface.co/Qwen/Qwen-Image-2.1-Turbo/blob/fc13ba1986fcb905854dc8de2f52eee395f49b5b/LICENSE"
[precision]
dtype = "bf16"
reason = "The text encoder's last-layer activations and the transformer's residual stream leave FP16's range (log/002-format.md)."
evidence = "log/002-format.md"
