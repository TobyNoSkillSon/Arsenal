# Settings panel reference for video models (docs/MODEL-FOLDER.md, "Settings panel"). Copy it beside model.toml and
# tailor it to the settings that model declares: shapes and lengths it supports, its frame rates, and Quality from
# its tuned step count (Final = tuned, Draft = fewer).
schema = 1

[[section]]

[[section.row]]
label = "Shape"
presets = [
  { title = "16:9", values = { width = 1280, height = 720 } },
  { title = "9:16", values = { width = 720, height = 1280 } },
  { title = "1:1", values = { width = 960, height = 960 } },
]

[[section.row]]
label = "Length"
presets = [
  { title = "2 s", values = { duration = 2 } },
  { title = "5 s", values = { duration = 5 } },
  { title = "10 s", values = { duration = 10 } },
]

[[section.row]]
setting = "fps"
labels = { 16 = "16 fps", 24 = "24 fps", 30 = "30 fps" }

[[section.row]]
label = "Quality"
presets = [
  { title = "Draft", values = { steps = 12 } },
  { title = "Final", values = { steps = 30 } },
]

[[section.row]]
setting = "seed"
randomize = true

[[section]]
title = "More"
collapsed = true

[[section.row]]
setting = "width"
unit = "px"

[[section.row]]
setting = "height"
unit = "px"

[[section.row]]
setting = "duration"
unit = "s"

[[section.row]]
setting = "steps"

[[section.row]]
setting = "guidance"
