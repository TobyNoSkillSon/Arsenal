[weights.sha256]
"model.safetensors" = "5ffab0e2cf52f61c5b7c7eb1e8542996736d1023a0212190cc09abc2119a1e09"
"config.json" = "2c96c24dd25f64e92753f6f2ba00cc7833b9923459403dcd8504e8700c0995df"

[weights.bytes]
