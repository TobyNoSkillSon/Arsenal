publisher = "MiniMax"
released = 2026
suggested = false
purpose = "Songs from lyrics and a description"
summary = "Complete 44.1 kHz stereo songs up to six minutes from lyrics and a music description, with vocals."
description = "MiniMax Music 3: an 8.6B global language model (from Qwen3-8B) writes one semantic music code per 25 Hz frame, a 0.65B local model fills seven residual codebooks, and their fused hidden states condition a 2.4B flow-matching transformer whose latents a 54M Flow-VAE decoder turns into stereo audio. 11.7B parameters in all."
tasks = ["text-to-audio"]
languages = ["en", "zh"]
good_for = ["Complete songs with sung vocals, up to six minutes", "Structured captions: genre, BPM, key, vocal timbre and section-by-section arrangement", "Instrumental pieces"]
limits = ["Section tags such as [verse] and [chorus] must stand on their own lines; text after a tag on the same line is dropped", "Duration is an upper bound: the model may end the song earlier, and past the given lyrics it may sing lines of its own", "Tempo, key, instrumentation and structure are guidance, not guarantees", "The maker documents no vocal languages; its examples are English, and Polish is untested", "Generation produces a complete file with progress, not live audio", "16-bit only: about 22 GB in memory when loaded"]
architecture = "minimax_music3"
[facets]
modalities_in = ["text"]
modalities_out = ["audio"]
