schema = 3
architecture = "moss_transcribe_diarize"
id = "moss-transcribe-diarize"
name = "MOSS-Transcribe-Diarize 0.9B"
kind = "audio"
params = "908.5M"
publisher = "OpenMOSS"
released = 2026
suggested = false
summary = "Transcribe long recordings with speaker labels and timestamps in one pass, using a native Swift MLX worker."
description = "OpenMOSS's end-to-end transcription and diarization model: a Whisper-Medium audio encoder feeds a Qwen3-0.6B decoder (908.5M parameters in all) that writes a compact transcript, each segment opening with its start time and an anonymous speaker label ([S01], [S02], …) and closing with its end time. It replaces a separate speech recognizer and diarizer, takes custom instructions and hotwords, and the maker says it handles 50+ languages and recordings up to 90 minutes. On the maker's benchmarks it reports cpCER 15.83 on AISHELL-4 and 7.37 on podcasts, ahead of Doubao, ElevenLabs and Gemini 2.5 Pro; it won the 2nd MLC-SLM challenge at INTERSPEECH 2026."
purpose = "Transcribe who said what, and when"
good_for = ["Meetings, calls, interviews and podcasts: who said what, with start and end times per segment", "Long recordings in one pass, without a separate diarization model", "Domain words: pass hotwords to steer the spelling of names and terms", "Custom instructions, such as speaker-only transcription without timestamps"]
limits = ["Speakers are anonymous labels in order of appearance ([S01], [S02], …), not identities, and are numbered afresh for each recording.", "Timestamps are per segment, not per word.", "Accepts up to 90 minutes per recording, as the maker states, but checked here only on recordings under a minute; a full hour of speech is estimated to need longer than the 590 s request limit.", "Trained mostly on Chinese and English; the maker claims 50+ languages but names none, so other languages, Polish included, are not verified by the maker.", "The default max_new_tokens of 5,120 covers about 13 minutes of dense speech; a reply cut short by it says truncated: true, and a longer recording needs a larger max_new_tokens."]
