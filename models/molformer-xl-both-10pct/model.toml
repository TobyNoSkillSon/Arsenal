schema = 3
id = "molformer-xl-both-10pct"
name = "MoLFormer-XL Both 10%"
kind = "local.molecules"
summary = "Turns a molecule written as a SMILES string into a vector of numbers for similarity search, clustering or property prediction."
description = "MoLFormer-XL is IBM Research's chemical language model (Ross et al., Nature Machine Intelligence 2022): a 12-layer, 768-wide transformer with linear attention and rotary positions, pretrained by masked language modelling on RDKit-canonical SMILES. This checkpoint was trained on 10% of ZINC15 plus 10% of PubChem. Arsenal returns the card's pooled embedding (the final-layer token embeddings averaged). The card reports, after fine-tuning, AUROC 91.5 on BBBP, 81.3 on HIV, 86.6 on BACE and 84.5 on Tox21."
purpose = "Embed molecules from SMILES"
publisher = "ibm-research"
released = 2023
params = "46.8M"
tasks = ["feature-extraction"]
languages = ["mul"]
good_for = ["Comparing molecules: structurally related compounds (caffeine and theobromine) get a higher cosine than unrelated ones (caffeine and aspirin)", "Features for a small classifier or regressor of a molecular property (solubility, toxicity, permeability) trained on top", "Clustering or visualising a compound library"]
limits = ["At most 200 SMILES tokens per molecule (training dropped longer ones); larger molecules and macromolecules are refused, and the card says they are untested", "SMILES only: input with characters outside SMILES is refused. Invalid or non-canonical SMILES and stereo marks give weaker embeddings (training used canonical SMILES with isomeric information removed); tokens missing from the vocabulary are read as unknown and listed in the reply", "Embeddings alone predict nothing: a property needs a model trained on top of them. Not for molecule generation; the masked-token head is not served", "This is the 10% ZINC + 10% PubChem checkpoint; the card's full MoLFormer-XL scores higher on most benchmarks", "Reads and writes no human language, so the Polish question does not apply", "Parity with the maker's modeling_molformer.py (MPS, float32, since its float16 path overflows) checked: see log/003-parity.md"]
suggested = false

