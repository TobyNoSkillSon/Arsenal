# SPDX-License-Identifier: MIT
schema = 3
id = "idol"
name = "IDOL"
architecture = "idol"
kind = "geometry"
params = "0.66B"
publisher = "speridlabs"
released = 2026
suggested = false
summary = "Turns one picture of an object into a 3D Gaussian splat (PLY)."
description = "IDOL is Speridlabs' single-image 3D model (2026): a rectified-flow transformer writes an 8,192-token object latent from the picture's DINOv3 and FLUX.2 VAE tokens, an octree decoder places anchor points and a Gaussian decoder turns each into 32 Gaussians, with an estimate of the camera that took the picture. The result is a standard 3D Gaussian Splatting PLY of up to about a million Gaussians."
purpose = "One picture to a 3D splat"
tasks = ["image-to-3d"]
languages = ["und"]
tools = ["operation"]
assets = ["idol-dinov3", "idol-flux2-vae"]
good_for = [
  "One object on a removed background: products, toys, furniture, food, figurines, renders and generated images",
  "A splat that opens in any 3D Gaussian Splatting viewer, with the input camera's angle and field of view",
  "32,768 to 1,048,576 Gaussians per object",
]
limits = [
  "The background is removed first with BiRefNet; give a cutout with a transparent background, or keep BiRefNet on the Mac",
  "A splat is not a mesh: it has no faces to edit, print or rig, and the Mac's own viewers do not open PLY splats",
  "The hidden back is invented; one object per picture",
  "A seed gives a different (equally valid) result than IDOL's PyTorch code with the same seed: the random numbers come from MLX",
  "Precision: every weight 16-bit (IDOL ships FP32; Get casts its modules to FP16, DINOv3 to BF16 and the VAE to FP16); norms, rotary angles and embeddings compute in float32 as IDOL's do",
]

[links]
homepage = "https://speridlabs.com/research/idol"

[facets]
modalities_in = ["image"]
modalities_out = ["image"]

[licence]
